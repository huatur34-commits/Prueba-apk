name: Exportar Godot a APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Compilar juego para Android
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Godot y compilar APK
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          
          unzip -q Godot_v4.2.1-stable_linux.x86_64.zip
          
          mkdir -p ~/.local/share/godot/export_templates/
          unzip -q Godot_v4.2.1-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/
          mv ~/.local/share/godot/export_templates/templates ~/.local/share/godot/export_templates/4.2.1.stable
          
          # Eliminar archivo viejo y crear uno nuevo limpio con todas las propiedades requeridas
          rm -f export_presets.cfg
          
          cat << EOT > export_presets.cfg
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          enc_password=""
          
          [preset.0.options]
          package/signed=false
          application/package_name="org.huatur34.pruebaapk"
          EOT
          
          mkdir -p build
          ./Godot_v4.2.1-stable_linux.x86_64 --headless --export-release "Android" build/juego.apk

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: juego-apk
          path: build/juego.apk
