name: Exportar Godot a APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Compilar juego para Android
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Compilar con Godot
        uses: firebelley/godot-export@v5.2.0
        with:
          godot_version: 4.2.1

