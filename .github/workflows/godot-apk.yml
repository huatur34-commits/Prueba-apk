name: Exportar Godot a APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Compilar juego para Android con Godot
        uses: abarrak/godot-action@v1.2.0
        with:
          name: juego-prueba
          android: true
