name: Exportar Godot a APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Compilar juego para Android
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Godot y compilar APK
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          
          unzip -q Godot_v4.2.1-stable_linux.x86_64.zip
          
          # Crear ruta correcta y descomprimir plantillas asegurando estructura
          mkdir -p ~/.local/share/godot/export_templates/
          unzip -q Godot_v4.2.1-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/
          mv ~/.local/share/godot/export_templates/templates ~/.local/share/godot/export_templates/4.2.1.stable
          
          # Crear archivo export_presets.cfg completo
          echo '[preset.0]' > export_presets.cfg
          echo 'name="Android"' >> export_presets.cfg
          echo 'platform="Android"' >> export_presets.cfg
          echo 'runnable=true' >> export_presets.cfg
          echo 'export_filter="all_resources"' >> export_presets.cfg
          echo 'export_path=""' >> export_presets.cfg
          echo '[preset.0.options]' >> export_presets.cfg
          echo 'package/signed=false' >> export_presets.cfg
          
          mkdir -p build
          ./Godot_v4.2.1-stable_linux.x86_64 --headless --export-release "Android" build/juego.apk

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: juego-apk
          path: build/juego.apk
